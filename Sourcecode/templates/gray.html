<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Tabela de Código de Gray</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
      body {
        background-image: url("./static/images/fundo_ubi.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        position: relative;
      }
      .overlay {
        background-color: rgba(30, 41, 59, 0.85); 
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0; 
      }
      img {
        margin-top: 20px;
      }
      .tablebg {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body class="min-h-screen flex items-center justify-center text-white">
    <div class="overlay"></div>
    <div id="root" class="relative z-10 w-full px-4"></div>

    <script type="text/babel">
      const App = () => {
        const [bits, setBits] = React.useState("{{ request.form.get('bits', '') }}");
        return (
          <div className="max-w-md mx-auto text-center">

            <div className="relative mb-6">
              <button type="button" onClick={() => window.location.href = "/"} className="absolute left-0 top-1/2 transform -translate-y-1/2 text-white hover:text-blue-300 text-3xl" title="Voltar" > ← </button>
              <img src="./static/images/logo_ubi_branca.png" alt="Logo UBI" className="mx-auto w-64 h-24"/>
            </div>

            <h1 className="text-3xl font-bold mb-6">Gerar Tabela de Código de Gray</h1>

            <form method="POST" className="flex flex-col gap-4 max-w-md mx-auto mb-8">
              <div className="text-left">
                <label htmlFor="bits" className="block mb-1 font-semibold">Número de bits:</label>
                <input
                  type="number"
                  id="bits"
                  name="bits"
                  value={bits}
                  onChange={(e) => setBits(e.target.value)}
                  onInvalid={(e) => e.target.setCustomValidity('Por favor, insira um valor entre 1 e 10')}
                  onInput={(e) => e.target.setCustomValidity('')}
                  className="text-black w-full rounded p-2"
                  min="1"
                  max="10"
                  required
                />
              </div>

              <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition-colors"> Gerar </button>
            </form>

            {% if tabela %}
              <div className="tablebg bg-gray-800 bg-opacity-50 rounded-lg p-6">
                <h2 className="text-2xl font-bold mb-4">Tabela de Gray com {{ n }} bits</h2>

                <div className="overflow-x-auto">
                  <table className="w-full border-collapse border border-gray-600">
                    <thead>
                      <tr className="bg-gray-700">
                        <th className="border border-gray-600 px-4 py-2 font-semibold">Decimal</th>
                        <th className="border border-gray-600 px-4 py-2 font-semibold">Código Binário</th>
                        <th className="border border-gray-600 px-4 py-2 font-semibold">Código Gray</th>
                      </tr>
                    </thead>
                    <tbody>
                      {% for decimal, binario, gray in tabela %}
                        <tr className="hover:bg-gray-700 hover:bg-opacity-50">
                          <td className="border border-gray-600 px-4 py-2 text-center">{{ decimal }}</td>
                          <td className="border border-gray-600 px-4 py-2 text-center font-mono">{{ binario }}</td>
                          <td className="border border-gray-600 px-4 py-2 text-center font-mono text-green-400">{{ gray }}</td>
                        </tr>
                      {% endfor %}
                    </tbody>
                  </table>
                </div>

              </div>

            {% endif %}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
